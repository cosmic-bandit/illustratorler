function show(n){index=(n+works.length)%works.length;const card=works[index],img=card.querySelector('img');const big=dialog.querySelector('img');big.src=img.src;big.alt=img.alt;dialog.querySelector('#detail').textContent=card.querySelector('h2').textContent+' · '+card.querySelector('figcaption p').textContent;dialog.querySelector('a').href=card.querySelector('a').href;dialog.querySelector('#pos').textContent=(index+1)+' / '+works.length}
